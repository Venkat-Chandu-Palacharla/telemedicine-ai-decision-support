name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ---------- Frontend: lint + build + test ----------
  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mental-health-bot-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mental-health-bot-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Run tests (vitest)
        run: npx vitest run

  # ---------- Backend: typecheck + test + build ----------
  backend:
    name: Backend API (Express/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run API tests
        run: npx vitest run

      - name: Build
        run: npm run build

  # ---------- ML pipeline: syntax validation ----------
  ml-pipeline:
    name: ML Pipeline (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate ML modules compile
        run: |
          cd ml
          python -m py_compile config.py train.py evaluate.py run_all.py \
            preprocessing/preprocess.py models/definitions.py \
            models/serializer.py explainability/shap_analysis.py
